name: Runtime randomisation

on:
  push:
    branches:
      - codex/runtime-randomisation
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3

      - name: Randomiser tests
        run: |
          python3 -m unittest \
            randomizer/test_runtime_randomizer.py \
            randomizer/test_utility_items.py \
            randomizer/test_regional_evolutions.py

      - name: Enable every runtime randomiser path
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "randomizer")
          import runtime_randomizer_config as runtime

          runtime.configure_runtime_randomizer(
              seed=0x12345678,
              selected_components=runtime.RUNTIME_COMPONENTS,
              pokemon_bst_mode="full",
              starter_three_stage_base=True,
              wild_allow_special=True,
              wild_similar_bst=True,
              wild_mode="runtime",
              static_mode="full",
              enable_all_fossils=True,
              fossil_only_replacements=True,
              trainer_allow_special=True,
              trainer_similar_bst=True,
              trainer_mode="full",
              trainer_type_themes=True,
              rival_starter_continuity=True,
              move_species_specific=True,
              move_same_type_bias=True,
          )
          PY

      # The repository intentionally ignores tools/compresSmol, which is
      # supplied by the local installer but is not available in a fresh clone.
      # Compile every touched C translation unit with the real ARM compiler;
      # the complete ROM continues to be built by the bundled local toolchain.
      - name: Compile runtime integration with ARM GCC
        env:
          GAME_VERSION: EMERALD
        run: |
          export TOOL_NAMES="bin2c gbafix gbagfx jsonproc mapjson mid2agb preproc ramscrgen rsfont scaninc trainerproc wav2agb"
          make -e -j$(nproc) -O \
            build/emerald/src/runtime_randomizer.o \
            build/emerald/src/battle_ai_main.o \
            build/emerald/src/battle_main.o \
            build/emerald/src/battle_move_resolution.o \
            build/emerald/src/field_specials.o \
            build/emerald/src/pokemon.o \
            build/emerald/src/roamer.o \
            build/emerald/src/scrcmd.o \
            build/emerald/src/script_pokemon_util.o \
            build/emerald/src/starter_choose.o \
            build/emerald/src/trade.o \
            build/emerald/src/wild_encounter.o \
            build/emerald/src/wild_encounter_ow.o
