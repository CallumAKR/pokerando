name: Runtime randomisation

on:
  push:
    branches:
      - codex/runtime-randomisation
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev python3

      - name: Randomiser tests
        run: |
          python3 -m unittest \
            randomizer/test_runtime_randomizer.py \
            randomizer/test_utility_items.py \
            randomizer/test_regional_evolutions.py

      - name: Enable every runtime randomiser path
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "randomizer")
          import runtime_randomizer_config as runtime

          runtime.configure_runtime_randomizer(
              seed=0x12345678,
              selected_components=runtime.RUNTIME_COMPONENTS,
              pokemon_bst_mode="full",
              starter_three_stage_base=True,
              wild_allow_special=True,
              wild_similar_bst=True,
              wild_mode="runtime",
              static_mode="full",
              enable_all_fossils=True,
              fossil_only_replacements=True,
              trainer_allow_special=True,
              trainer_similar_bst=True,
              trainer_mode="full",
              trainer_type_themes=True,
              rival_starter_continuity=True,
              move_species_specific=True,
              move_same_type_bias=True,
          )
          PY

      - name: Generate ignored source headers
        run: |
          make -j$(nproc) -f make_tools.mk \
            tools/jsonproc tools/mapjson tools/preproc tools/trainerproc
          make generated

      # A fresh clone cannot run the full asset build because this repository
      # intentionally ignores the installer-supplied compresSmol tool.
      - name: Check runtime engine with ARM GCC
        run: |
          arm-none-eabi-gcc \
            -fsyntax-only -std=gnu17 \
            -mthumb -mthumb-interwork -mabi=apcs-gnu \
            -mtune=arm7tdmi -march=armv4t \
            -DMODERN=1 -DTESTING=0 -DEMERALD \
            -iquote include -iquote tools/agbcc/include \
            -Wno-attributes -Wno-unknown-pragmas \
            src/runtime_randomizer.c

      - name: Compile trainer runtime hook with project pipeline
        run: |
          mkdir -p build/emerald/src build/assets
          make NODEP=1 build/emerald/src/battle_main.o
          if arm-none-eabi-objdump -h build/emerald/src/battle_main.o \
            | awk '$2 == ".data" && $3 != "00000000" { found = 1 } END { exit !found }'
          then
            echo "battle_main.o contains writable .data discarded by the linker"
            exit 1
          fi
