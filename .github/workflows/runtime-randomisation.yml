name: Runtime randomisation

on:
  push:
    branches:
      - codex/runtime-randomisation
  pull_request:
  workflow_dispatch:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libpng-dev pkg-config python3 zlib1g-dev

      - name: Randomiser tests
        run: |
          python3 -m unittest \
            randomizer/test_runtime_randomizer.py \
            randomizer/test_cap_candy.py \
            randomizer/test_utility_items.py \
            randomizer/test_regional_evolutions.py

      - name: Enable every runtime randomiser path
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "randomizer")
          import runtime_randomizer_config as runtime

          runtime.configure_runtime_randomizer(
              seed=0x12345678,
              selected_components=runtime.RUNTIME_COMPONENTS,
              pokemon_bst_mode="full",
              starter_three_stage_base=True,
              wild_allow_special=True,
              wild_similar_bst=True,
              wild_mode="runtime",
              static_mode="full",
              enable_all_fossils=True,
              fossil_only_replacements=True,
              trainer_allow_special=True,
              trainer_similar_bst=True,
              trainer_mode="full",
              trainer_type_themes=True,
              rival_starter_continuity=True,
              move_species_specific=True,
              move_same_type_bias=True,
          )
          PY

      - name: Generate ignored source headers
        run: |
          make -j$(nproc) -f make_tools.mk \
            tools/gbagfx tools/jsonproc tools/mapjson tools/preproc \
            tools/trainerproc
          make generated
          make \
            build/assets/graphics/bag/select_button.png.4bpp \
            build/assets/graphics/party_menu/hold_icons.png.4bpp \
            build/assets/graphics/party_menu/hold_icons.png.gbapal

      # A fresh clone cannot run the full asset build because this repository
      # intentionally ignores the installer-supplied compresSmol tool.
      - name: Check runtime engine with ARM GCC
        run: |
          arm-none-eabi-gcc \
            -fsyntax-only -std=gnu17 \
            -mthumb -mthumb-interwork -mabi=apcs-gnu \
            -mtune=arm7tdmi -march=armv4t \
            -DMODERN=1 -DTESTING=0 -DEMERALD \
            -iquote include -iquote tools/agbcc/include \
            -Wno-attributes -Wno-unknown-pragmas \
            src/runtime_randomizer.c

      - name: Compile changed runtime sources with project pipeline
        run: |
          set -o pipefail
          mkdir -p build/assets
          cc1_path="$(arm-none-eabi-gcc --print-prog-name=cc1)"
          for source in \
            src/battle_main.c \
            src/item.c \
            src/item_menu.c \
            src/load_save.c \
            src/party_menu.c \
            src/runtime_randomizer.c \
            src/save.c \
            src/wild_encounter.c
          do
            base="$(basename "$source" .c)"
            arm-none-eabi-cpp \
              -iquote include -Wno-trigraphs \
              -DMODERN=1 -DTESTING=0 -DEMERALD -std=gnu17 \
              "$source" \
              | tools/preproc/preproc -i -g build/assets \
                  "$source" charmap.txt \
              | "$cc1_path" -quiet \
                  -mthumb -mthumb-interwork -O2 -mabi=apcs-gnu \
                  -mtune=arm7tdmi -march=armv4t \
                  -Wno-pointer-to-int-cast -std=gnu17 -Werror -Wall \
                  -Wno-strict-aliasing -Wno-attribute-alias \
                  -Woverride-init -Wnonnull -Wenum-conversion \
                  -Wno-error=unused-function -o "/tmp/$base.s" -
            arm-none-eabi-as \
              -mcpu=arm7tdmi -march=armv4t -meabi=5 \
              -o "/tmp/$base.o" "/tmp/$base.s"
          done
          if arm-none-eabi-objdump -h /tmp/battle_main.o \
            | awk '$2 == ".data" && $3 != "00000000" { found = 1 } END { exit !found }'
          then
            echo "battle_main.o contains writable .data discarded by the linker"
            exit 1
          fi
